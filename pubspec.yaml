name: leancode_kratos_client
description: >
  A Flutter library for connecting to Ory Kratos.
  It helps manage user authentication, registration, making it simple to add identity features to your app.

repository: https://github.com/leancodepl/leancode_kratos
version: 0.9.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  collection: ^1.19.1
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  json_annotation: ^4.10.0
  logging: ^1.3.0
  meta: ^1.18.0

dev_dependencies:
  build_runner: ^2.11.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.12.0
  leancode_lint: ^20.0.0
  mocktail: ^1.0.4

dependency_overrides:
  # Flutter pins meta to 1.17.0, but analyzer 10 requires 1.18.0
  meta: ^1.18.0
